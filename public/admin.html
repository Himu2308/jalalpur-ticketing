<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jalalpur Fun — Admin Dashboard</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="wrap">
  <div class="brand">JALALPUR<span> FUN</span></div>
  <div class="tagline">Admin dashboard</div>
  <div style="margin-bottom:18px;">
    <a class="nav-link" href="/index.html">Book a Ride</a>
    <a class="nav-link" href="/staff.html">Staff Scanner</a>
  </div>

  <div id="login-panel" class="panel">
    <div class="section-title" style="margin-top:0;">Admin sign-in</div>
    <div class="input-row">
      <input class="input" id="admin-key-input" type="password" placeholder="Admin access key" />
      <button class="btn-secondary" id="login-btn">Sign in</button>
    </div>
  </div>

  <div id="dash" style="display:none;"></div>
</div>

<script>
const KEY_STORAGE = 'jf_admin_key';
let adminKey = sessionStorage.getItem(KEY_STORAGE) || '';

function showPanel() {
  document.getElementById('login-panel').style.display = adminKey ? 'none' : 'block';
  document.getElementById('dash').style.display = adminKey ? 'block' : 'none';
  if (adminKey) loadSummary();
}

document.getElementById('login-btn').onclick = () => {
  const val = document.getElementById('admin-key-input').value.trim();
  if (!val) return;
  adminKey = val;
  sessionStorage.setItem(KEY_STORAGE, val);
  showPanel();
};

async function loadSummary() {
  const dash = document.getElementById('dash');
  dash.innerHTML = `<div class="empty"><span class="spin"></span> Loading today's activity…</div>`;
  try {
    const res = await fetch('/api/admin/summary', { headers: { 'x-app-key': adminKey } });
    if (res.status === 401) {
      adminKey = ''; sessionStorage.removeItem(KEY_STORAGE); showPanel(); return;
    }
    const d = await res.json();
    const topRide = d.rideRows[0];
    dash.innerHTML = `
      <button class="btn-secondary" id="refresh-btn" style="float:right;">Refresh</button>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Revenue</div><div class="stat-value">₹${d.revenue}</div></div>
        <div class="stat-card"><div class="stat-label">Tickets sold</div><div class="stat-value">${d.sold}</div></div>
        <div class="stat-card"><div class="stat-label">Redeemed</div><div class="stat-value">${d.used}</div></div>
        <div class="stat-card"><div class="stat-label">Top ride</div><div class="stat-value" style="font-size:16px;">${topRide?topRide.name:'—'}</div></div>
      </div>
      <div class="section-title">Per-ride breakdown</div>
      ${d.rideRows.length ? `<table class="tbl"><thead><tr><th>Ride</th><th>Tickets</th><th>Revenue</th></tr></thead><tbody>
        ${d.rideRows.map(r=>`<tr><td>${r.name}</td><td>${r.count}</td><td>₹${r.revenue}</td></tr>`).join('')}
      </tbody></table>` : `<div class="empty">No tickets sold yet.</div>`}
      <div class="section-title">Recent tickets</div>
      ${d.recent.length ? `<table class="tbl"><thead><tr><th>Code</th><th>Ride</th><th>Price</th><th>Status</th><th>Time</th></tr></thead><tbody>
        ${d.recent.map(t=>`<tr><td style="font-family:'JetBrains Mono',monospace;">${t.code}</td><td>${t.ride_name}</td><td>₹${t.price}</td><td><span class="badge ${t.status==='used'?'used':'valid'}">${t.status}</span></td><td>${new Date(t.created_at).toLocaleTimeString()}</td></tr>`).join('')}
      </tbody></table>` : ''}
    `;
    document.getElementById('refresh-btn').onclick = loadSummary;
  } catch (err) {
    dash.innerHTML = `<div class="empty">Could not load dashboard. Check your connection and try refreshing.</div>`;
  }
}

showPanel();
</script>
</body>
</html>
